name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate desktop release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Validate release version
        working-directory: mindsurf-voice-ai
        shell: bash
        run: |
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          cargo_version="$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).packages[0].version")"

          if [[ "$package_version" != "$app_version" || "$cargo_version" != "$app_version" ]]; then
            echo "Version mismatch: tauri=$app_version package=$package_version cargo=$cargo_version" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must equal v$app_version" >&2
            exit 1
          fi

  macos-release:
    name: Ad-hoc signed universal macOS release
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mindsurf-voice-ai/package-lock.json

      - name: Set up universal Rust targets
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: mindsurf-voice-ai
        run: npm ci

      - name: Build and publish macOS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: mindsurf-voice-ai
          tagName: v__VERSION__
          releaseName: MindSurf Voice AI v__VERSION__
          releaseBody: |
            Universal macOS DMG and Windows x64 NSIS installer.

            These packages do not use paid platform certificates. macOS may require
            approval in Privacy & Security, and Windows may show an unknown publisher warning.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg

  windows-release:
    name: Unsigned Windows x64 release
    needs: macos-release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mindsurf-voice-ai/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install frontend dependencies
        working-directory: mindsurf-voice-ai
        run: npm ci

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: mindsurf-voice-ai
          tagName: v__VERSION__
          releaseDraft: true
          args: --bundles nsis
